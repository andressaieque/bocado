<!doctype html>
<html lang="pt-BR">

<meta charset="utf-8">

<title>bocado · vitrine</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Ajuste aqui ===== */
:root{
  --fundo:transparent;  /* fundo transparente: só o celular aparece */
  --moldura:#111114;    /* cor da moldura do celular */
  --texto:#111114;
  --mudo:#6B6B74;
  --amarelo:#FFC100;
}
/* ======================= */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fundo);color:var(--texto);font-family:Outfit,system-ui,sans-serif;overflow:hidden}
.palco{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0}
.com-controles .palco{padding:16px}
/* área que recebe o celular; o tamanho real do celular vem do JS */
.area{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.escala{flex:none;position:relative}
/* celular no tamanho real: tela 390x844 + 12px de borda */
.cel{position:absolute;left:0;top:0;width:414px;height:868px;transform-origin:0 0;
  background:var(--moldura);border-radius:62px;padding:12px;
  box-shadow:0 0 0 2px #2c2c33 inset}
.tela{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:#fff;isolation:isolate}
.tela iframe{position:absolute;inset:0;width:390px;height:844px;border:0;display:block;background:#fff;transition:opacity .35s ease}
.tela iframe.sai{opacity:0}
.camera{position:absolute;left:50%;top:12px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#0b0b0d;box-shadow:0 0 0 2px #1d1d22;z-index:3;pointer-events:none}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#111114;opacity:.85;z-index:3;pointer-events:none}
/* controles */
.ctl{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px}
.passos{display:flex;gap:8px;width:100%}
.passo{flex:1;min-width:0;border:0;background:none;padding:0;font:inherit;cursor:pointer;color:var(--mudo);text-align:left}
.passo .trilho{display:block;height:3px;border-radius:2px;background:#DCDCE0;overflow:hidden}
.passo .enche{display:block;height:100%;width:0;background:var(--texto)}
.passo .nome{display:block;font-size:12px;font-weight:300;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.passo.on .nome{color:var(--texto);font-weight:400}
.passo.feito .enche{width:100%}
.botoes{display:flex;gap:8px}
.botoes button{height:36px;min-width:36px;padding:0 14px;border:1px solid #DCDCE0;background:#fff;border-radius:99px;font:inherit;font-size:13px;color:var(--texto);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.botoes button:hover{border-color:var(--texto)}
.botoes button:focus-visible,.passo:focus-visible{outline:2px solid var(--texto);outline-offset:2px}
.ctl{display:none}.com-controles .ctl{display:flex}
@media (prefers-reduced-motion:reduce){.tela iframe{transition:none}}
</style>
</head>
<body>
<div class="palco">
  <div class="area" id="area">
    <div class="escala" id="escala">
      <div class="cel" id="cel">
        <div class="tela" id="tela"><span class="camera"></span><span class="home"></span></div>
      </div>
    </div>
  </div>
  <div class="ctl">
    <div class="passos" id="passos"></div>
    <div class="botoes">
      <button id="ant" aria-label="Tela anterior">‹</button>
      <button id="play" aria-label="Pausar">Pausar</button>
      <button id="prox" aria-label="Próxima tela">›</button>
    </div>
  </div>
</div>

(function(){
  var W = 414, H = 868;                       // celular com borda
  var params = new URLSearchParams(location.search);
  if (params.get('controles') === '1') document.body.classList.add('com-controles');  // controles escondidos, a não ser com ?controles=1

  var area = document.getElementById('area');
  var escala = document.getElementById('escala');
  var cel = document.getElementById('cel');
  var tela = document.getElementById('tela');
  var passos = document.getElementById('passos');
  var btPlay = document.getElementById('play');
  var atual = -1, tocando = params.get('autoplay') !== '0', timer = null, inicio = 0, restante = 0, raf = 0;

  /* escala o celular inteiro para caber no espaço, sem deformar nada */
  function ajustar(){
    var r = area.getBoundingClientRect();
    var s = Math.min(1, r.width / W, r.height / H);
    if (!(s > 0)) s = 1;
    cel.style.transform = 'scale(' + s + ')';
    escala.style.width = (W * s) + 'px';
    escala.style.height = (H * s) + 'px';
  }
  if (window.ResizeObserver) new ResizeObserver(ajustar).observe(area);
  window.addEventListener('resize', ajustar);
  ajustar();

  TELAS.forEach(function(t, i){
    var b = document.createElement('button');
    b.className = 'passo';
    b.setAttribute('aria-label', 'Ver ' + t.nome);
    b.innerHTML = '<span class="trilho"><span class="enche"></span></span><span class="nome">' + t.nome + '</span>';
    b.onclick = function(){ ir(i); };
    passos.appendChild(b);
  });
  var bts = [].slice.call(passos.children);

  function ir(i){
    i = (i + TELAS.length) % TELAS.length;
    var velho = tela.querySelector('iframe');
    var f = document.createElement('iframe');
    f.title = TELAS[i].nome;
    f.setAttribute('scrolling', 'no');
    f.srcdoc = TELAS[i].doc;              // recriar o iframe reinicia as animações
    if (velho) { f.style.opacity = '0'; }
    tela.insertBefore(f, tela.querySelector('.camera'));
    f.onload = function(){
      f.style.opacity = '';
      if (velho) { velho.classList.add('sai'); setTimeout(function(){ velho.remove(); }, 400); }
    };
    atual = i;
    bts.forEach(function(b, j){
      b.classList.toggle('on', j === i);
      b.classList.toggle('feito', j < i);
      b.querySelector('.enche').style.width = j < i ? '100%' : '0';
    });
    restante = TELAS[i].tempo;
    agendar();
  }

  function agendar(){
    clearTimeout(timer); cancelAnimationFrame(raf);
    if (!tocando) return;
    inicio = performance.now();
    timer = setTimeout(function(){ ir(atual + 1); }, restante);
    var total = TELAS[atual].tempo, barra = bts[atual].querySelector('.enche');
    (function passo(){
      var feito = total - restante + (performance.now() - inicio);
      barra.style.width = Math.min(100, feito / total * 100) + '%';
      if (tocando) raf = requestAnimationFrame(passo);
    })();
  }

  function pausar(){
    if (!tocando) return;
    tocando = false;
    restante = Math.max(0, restante - (performance.now() - inicio));
    clearTimeout(timer); cancelAnimationFrame(raf);
    btPlay.textContent = 'Tocar'; btPlay.setAttribute('aria-label', 'Tocar');
  }
  function tocar(){
    if (tocando) return;
    tocando = true;
    btPlay.textContent = 'Pausar'; btPlay.setAttribute('aria-label', 'Pausar');
    agendar();
  }
  if (!tocando) { btPlay.textContent = 'Tocar'; btPlay.setAttribute('aria-label', 'Tocar'); }

  btPlay.onclick = function(){ tocando ? pausar() : tocar(); };
  document.getElementById('ant').onclick = function(){ ir(atual - 1); };
  document.getElementById('prox').onclick = function(){ ir(atual + 1); };
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') ir(atual + 1);
    else if (e.key === 'ArrowLeft') ir(atual - 1);
    else if (e.key === ' ') { e.preventDefault(); tocando ? pausar() : tocar(); }
  });

  /* toques nos botões das telas: se levar a uma das 4 telas, vai para ela */
  window.addEventListener('message', function(e){
    if (!e.data || !e.data.go) return;
    var alvo = String(e.data.go).split('/').pop();
    for (var i = 0; i < TELAS.length; i++) if (TELAS[i].id === alvo) { ir(i); return; }
  });

  ir(0);
})();
</script>
